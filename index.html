<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ee7623" />
    <title>HFI Course Guide</title>
    <script type="module" crossorigin src="./assets/results-BMo15dx2.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/theme-8sur17RA.js">
    <link rel="modulepreload" crossorigin href="./assets/supabaseClient-P-GeFcyb.js">
    <link rel="modulepreload" crossorigin href="./assets/compare-B7QgSJRy.js">
    <link rel="modulepreload" crossorigin href="./assets/surveyData-BpBrOTOz.js">
    <link rel="modulepreload" crossorigin href="./assets/reviewFooter-Br5oK_t9.js">
    <link rel="stylesheet" crossorigin href="./assets/theme-Cj5QmETl.css">
  <script>// Added to every page's <head> by vite.config.ts, so the page is drawn in the right theme from
// the start instead of flashing light first. Keep in step with resolveTheme() in theme.ts.
(function () {
  var choice = "auto";
  try {
    choice = localStorage.getItem("hfi-theme") || "auto";
  } catch (error) {
    // Storage can be blocked; automatic is fine.
  }
  var hour = new Date().getHours();
  var dark = choice === "dark" || (choice === "auto" && (hour >= 19 || hour < 7));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
  </head>
  <body>
    <div class="app">
      <header class="app-bar">
        <p class="app-name">HFI Course Guide</p>
        <h1>Course Results</h1>
        <p class="app-bar-subtitle">Average grades, difficulty, and ratings from an anonymous HFI student survey.</p>
      </header>
      <section class="welcome-card" id="welcome-card" aria-label="Welcome">
        <div class="welcome-photo" role="img" aria-label="A photo of HFI taken by a student"></div>
        <div class="welcome-text">
          <p class="welcome-greeting" id="welcome-greeting"></p>
          <p class="welcome-name" id="welcome-name">HFI student</p>
        </div>
        <p class="photo-credit" id="photo-credit"></p>
      </section>
      <main>
        <label class="search-control">
          <span class="visually-hidden">Search courses</span>
          <input id="course-search" type="search" placeholder="Search courses, e.g. calc" autocomplete="off" />
        </label>
        <div class="view-switch" role="group" aria-label="How to show courses">
          <button type="button" data-view="chart" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="15" r="3" /><circle cx="15" cy="8" r="4" /><circle cx="18" cy="17" r="2" /></svg>
            Compare chart
          </button>
          <button type="button" data-view="list" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
            Course list
          </button>
        </div>
        <label class="sort-control">
          Sort by
          <select id="sort-select"></select>
        </label>
        <div id="course-map"></div>
        <ul id="course-list" class="course-list" hidden></ul>
      </main>
      <nav class="tab-bar" aria-label="Pages" data-current="courses"></nav>
    </div>
  </body>
</html>
