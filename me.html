  <script>// Added to every page's <head> by vite.config.ts, so the page is drawn in the right theme from
// the start instead of flashing light first. Keep in step with resolveTheme() in theme.ts.
(function () {
  var choice = "auto";
  try {
    choice = localStorage.getItem("hfi-theme") || "auto";
  } catch (error) {
    // Storage can be blocked; automatic is fine.
  }
  var hour = new Date().getHours();
  var dark = choice === "dark" || (choice === "auto" && (hour >= 19 || hour < 7));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
  </head>
  <body>
    <div class="app">
      <header class="app-bar app-bar-with-tools">
        <div class="theme-switch" role="group" aria-label="Light or dark mode">
          <button type="button" data-theme-choice="auto" aria-pressed="false">Auto</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">Dark</button>
        </div>
        <p class="app-name">HFI Course Guide</p>
