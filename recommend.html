<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ee7623" />
    <title>HFI AP Recommender</title>
    <script type="module" crossorigin src="./assets/recommender-D7hQHKe1.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/theme-Be-lJOYw.js">
    <link rel="modulepreload" crossorigin href="./assets/supabaseClient-BXFmhSIm.js">
    <link rel="modulepreload" crossorigin href="./assets/surveyData-DfCKCEpJ.js">
    <link rel="modulepreload" crossorigin href="./assets/reviewFooter-DyGzJW-u.js">
    <link rel="stylesheet" crossorigin href="./assets/theme-ebS0E2ZN.css">
  <script>// Added to every page's <head> by vite.config.ts, so the page is drawn in the right theme from
// the start instead of flashing light first. Keep in step with resolveTheme() in theme.ts.
(function () {
  var choice = "auto";
  try {
    choice = localStorage.getItem("hfi-theme") || "auto";
  } catch (error) {
    // Storage can be blocked; automatic is fine.
  }
  var hour = new Date().getHours();
  var dark = choice === "dark" || (choice === "auto" && (hour >= 19 || hour < 7));
  document.documentElement.dataset.theme = dark ? "dark" : "light";
})();
</script>
  </head>
  <body>
    <div class="app">
      <header class="app-bar">
        <p class="app-name">HFI Course Guide</p>
        <h1>AP Recommender</h1>
        <p class="app-bar-subtitle">Tell us what you want to study in college, and we'll suggest HFI courses that fit.</p>
      </header>
      <main>
        <form id="recommender-form" class="quiz">
          <label class="quiz-question">
            <span class="question-label">1. What do you want to study in college?</span>
            <select name="major" required>
              <option value="">Choose a major…</option>
            </select>
          </label>

          <fieldset class="quiz-question">
            <legend class="question-label">2. What year are you in?</legend>
            <div class="choices">
              <label><input type="radio" name="year" value="Y9" required /> Y9</label>
              <label><input type="radio" name="year" value="Y10" /> Y10</label>
              <label><input type="radio" name="year" value="Y11" /> Y11</label>
              <label><input type="radio" name="year" value="Y12" /> Y12</label>
            </div>
          </fieldset>

          <fieldset class="quiz-question">
            <legend class="question-label">3. How much workload do you want?</legend>
            <div class="choices choices-stacked">
              <label>
                <input type="radio" name="workload" value="manageable" required />
                Manageable — I care about keeping a high GPA
              </label>
              <label>
                <input type="radio" name="workload" value="challenging" />
                Challenging — I want the hardest courses
              </label>
            </div>
          </fieldset>

          <button type="submit">Show my recommendations</button>
        </form>

        <section id="recommendation-results" aria-live="polite"></section>
      </main>
      <nav class="tab-bar" aria-label="Pages" data-current="recommender"></nav>
    </div>
  </body>
</html>
